<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter and Dark Mode</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Live Character Counter and Dark Mode</h1>
    <label for='note-text'>Type your note below:</label>
    <textarea id="note-text" class="note-text" placeholder="Start typing your note here..."></textarea>
    <p id="char-count">0 / 200 characters</p>
    <p id="word-count">0 words</p>
    <button id="clear-btn" class="clear-btn">Clear Text</button>
    <button id="theme-toggle" class="theme-toggle">Dark mode</button>
</body>
</html>
